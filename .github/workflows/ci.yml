name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Annule le run précédent sur la même branche dès qu'un nouveau push arrive
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Backend — Jest (schemas, middleware, routes avec mocks) ──────────────────
  backend:
    name: Backend (Jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      JWT_SECRET: ci-test-secret-not-for-production
      # Les tests mockent Prisma — ces URLs ne sont jamais contactées
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      DIRECT_URL: postgresql://test:test@localhost:5432/test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Lancer les tests Jest
        run: npm test

  # ─── Frontend — Vitest + vite build ──────────────────────────────────────────
  frontend:
    name: Frontend (Vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Lancer les tests Vitest
        run: npm run test:run

      - name: Vérifier le build Vite
        run: npm run build
        # .env.production (commité) fournit VITE_API_URL, VITE_SUPABASE_URL,
        # VITE_SUPABASE_ANON_KEY — aucune variable secrète requise en CI.
